<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>

<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
:root{
  --ground:#E9E5DA; --ground-2:#DDD8CB; --panel:#F4F1EA;
  --ink:#191410; --ink-2:#574E44; --ink-3:#867C6F;
  --vermilion:#C4331C; --bronze:#4F7460; --gold:#9C7C24;
  --line:rgba(25,20,16,.16); --line-2:rgba(25,20,16,.08);
  --shadow:0 2px 0 rgba(25,20,16,.05), 0 18px 40px -30px rgba(25,20,16,.6);
  --serif:"Noto Serif TC",Songti TC,SimSun,Georgia,serif;
  --sans:"Noto Sans TC",-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#141110; --ground-2:#1E1917; --panel:#231E1A;
    --ink:#EFE6D4; --ink-2:#AC9E88; --ink-3:#7E7263;
    --vermilion:#E85235; --bronze:#84AE93; --gold:#DCB44C;
    --line:rgba(239,230,212,.18); --line-2:rgba(239,230,212,.08);
    --shadow:0 2px 0 rgba(239,230,212,.04), 0 18px 44px -26px #000;
  }
}
:root[data-theme="dark"]{
  --ground:#141110; --ground-2:#1E1917; --panel:#231E1A;
  --ink:#EFE6D4; --ink-2:#AC9E88; --ink-3:#7E7263;
  --vermilion:#E85235; --bronze:#84AE93; --gold:#DCB44C;
  --line:rgba(239,230,212,.18); --line-2:rgba(239,230,212,.08);
  --shadow:0 2px 0 rgba(239,230,212,.04), 0 18px 44px -26px #000;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); -webkit-font-smoothing:antialiased;
  height:100dvh; overflow:hidden; display:flex; flex-direction:column;
}

.bar{flex:0 0 auto;display:flex;align-items:center;gap:1rem;padding:.6rem clamp(1rem,3vw,2.2rem);border-bottom:1px solid var(--line-2);background:var(--ground)}
.mark{display:flex;align-items:baseline;gap:.6rem;margin-right:auto;min-width:0}
.mark b{font-family:var(--serif);font-weight:900;font-size:1.05rem;letter-spacing:.06em}
.mark span{font-size:.72rem;color:var(--ink-3);letter-spacing:.2em;white-space:nowrap}
@media (max-width:700px){.mark span{display:none}}
.tools{display:flex;gap:.4rem;align-items:center}
.btn{font:inherit;font-size:.78rem;letter-spacing:.08em;color:var(--ink-2);background:transparent;border:1px solid var(--line);border-radius:2px;padding:.4rem .7rem;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--ink-3)}
.btn[aria-pressed="true"]{background:var(--vermilion);border-color:var(--vermilion);color:#fff}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.count{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--ink-3);min-width:4.4em;text-align:right}

.stage{flex:1 1 auto;position:relative;overflow:hidden}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;justify-content:safe center;
  padding:clamp(.9rem,3vh,2rem) clamp(1.2rem,4.5vw,4rem);
  gap:clamp(.55rem,1.8vh,1.2rem);overflow-y:auto;
  animation:in .34s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}

.eyebrow{font-size:clamp(.75rem,1.1vw,.98rem);letter-spacing:.28em;color:var(--vermilion);font-weight:700;display:flex;align-items:center;gap:.8rem;flex:0 0 auto}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line-2);max-width:12rem}
h2{font-family:var(--serif);font-weight:900;margin:0;line-height:1.14;font-size:clamp(2rem,5vw,4.2rem);text-wrap:balance;flex:0 0 auto}
.lede{font-size:clamp(1.1rem,2.1vw,1.9rem);line-height:1.5;color:var(--ink-2);max-width:28em;font-weight:500;margin:0}
.lede b{color:var(--ink);font-weight:900}

ul.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(.45rem,1.4vh,1rem)}
ul.pts li{position:relative;padding-left:1.5em;font-size:clamp(1.1rem,1.95vw,1.75rem);line-height:1.48}
ul.pts li::before{content:"";position:absolute;left:.15em;top:.62em;width:.46em;height:.46em;background:var(--vermilion);transform:rotate(45deg)}
ul.pts li b{font-weight:900;color:var(--ink)}

.callout{border-left:5px solid var(--gold);background:var(--panel);padding:clamp(.7rem,1.8vh,1.2rem) clamp(.85rem,2vw,1.5rem);font-size:clamp(1.1rem,1.9vw,1.7rem);line-height:1.5;box-shadow:var(--shadow);max-width:36em;font-weight:500}
.callout b{color:var(--vermilion);font-weight:900}

.art{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(.9rem,2.4vw,2.4rem);align-items:center;min-height:0}
.art.wide{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
@media (max-width:900px){.art,.art.wide{grid-template-columns:minmax(0,1fr)}}
.art>.txt{display:flex;flex-direction:column;gap:clamp(.5rem,1.6vh,1rem);min-width:0}
/* 文字一律夾在容器裡，不外溢 */
.callout,.lede,.foot,ul.pts li,.tl div,.tier div,.map span,.dyn i,.cover .sub,.cover .meta dd{overflow-wrap:break-word}
.dyn i{flex:1 1 0;min-width:0}
.slide>*{max-width:100%;flex-shrink:0}

.cast{display:flex;gap:clamp(.5rem,1.8vw,1.6rem);justify-content:center;flex-wrap:wrap;align-items:flex-end}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:.25rem;min-width:0;max-width:100%}
figure svg{display:block;height:clamp(120px,29vh,310px);width:auto;max-width:100%;overflow:hidden}
.emo{display:block;height:clamp(104px,25vh,230px);width:auto;max-width:100%}
figcaption{font-family:var(--serif);font-weight:900;font-size:clamp(.9rem,1.45vw,1.25rem);color:var(--ink);text-align:center;line-height:1.25;overflow-wrap:break-word}
figcaption small{display:block;font-family:var(--sans);font-weight:400;font-size:.74em;color:var(--ink-3)}
.pic{position:relative;display:block}
figure.no .emo{filter:grayscale(1);opacity:.42}
figure.no .pic::after{content:"";position:absolute;left:2%;right:2%;top:48%;height:7px;border-radius:4px;background:var(--vermilion);transform:rotate(-20deg)}

/* 真實照片與地圖 */
.photo{display:block;max-width:100%;height:auto;border-radius:4px;border:1px solid var(--line-2);box-shadow:var(--shadow);cursor:zoom-in;background:var(--panel)}
figure.ph .photo{height:clamp(150px,36vh,400px);width:auto;object-fit:cover}
.mapbox{display:flex;flex-direction:column;gap:.35rem;align-items:center;min-width:0}
.mapbox .photo{max-height:clamp(220px,54vh,720px);width:auto;cursor:zoom-in}
.mapbox figcaption{font-size:clamp(.85rem,1.3vw,1.1rem)}
.zoomhint{font-size:.72rem;color:var(--ink-3);letter-spacing:.04em}
/* 一列擺三樣以上時整組縮一級（明確標 tight，不靠 :has） */
.cast.tight .emo{height:clamp(86px,20vh,192px)}
.cast.tight figure svg{height:clamp(102px,24vh,248px)}
.cast.tight figure.ph .photo{height:clamp(122px,29vh,322px)}
.cast.tight figcaption{font-size:clamp(.85rem,1.3vw,1.1rem)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:clamp(.6rem,1.6vw,1.3rem)}
.card{background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:clamp(.6rem,1.5vh,1.1rem) clamp(.8rem,1.4vw,1.2rem);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.4rem;align-items:center;text-align:center;min-width:0;overflow:hidden}
.card svg{height:clamp(112px,25vh,270px);width:auto;max-width:100%;overflow:hidden}
.card .emo{height:clamp(100px,23vh,220px)}
.card .photo{height:clamp(124px,27vh,300px);width:auto;object-fit:cover}
.card h3{font-family:var(--serif);font-weight:900;margin:0;font-size:clamp(1.15rem,1.95vw,1.7rem);overflow-wrap:break-word}
.card p{margin:0;font-size:clamp(.95rem,1.5vw,1.3rem);line-height:1.45;color:var(--ink-2);overflow-wrap:break-word}
.card p b{color:var(--ink);font-weight:900}

.tl{display:flex;flex-direction:column;max-width:42em}
.tl div{display:grid;grid-template-columns:5.2em 1fr auto;gap:1rem;align-items:baseline;padding:clamp(.28rem,.95vh,.6rem) 0;border-bottom:1px solid var(--line-2);font-size:clamp(1rem,1.75vw,1.5rem)}
.tl div:last-child{border-bottom:0}
.tl .yr{font-variant-numeric:tabular-nums;font-weight:900;color:var(--vermilion);font-family:var(--serif)}
.tl .ago{color:var(--ink-3);font-size:.78em;font-variant-numeric:tabular-nums}
.tl div.now .yr{color:var(--bronze)}

.dyn{display:flex;gap:4px;font-size:clamp(.82rem,1.25vw,1.15rem);font-weight:700}
.dyn i{font-style:normal;padding:clamp(.45rem,1.5vh,.9rem) .3rem;text-align:center;background:var(--ground-2);color:var(--ink-2);border-radius:3px;line-height:1.35}
.dyn i.on{background:var(--vermilion);color:#fff}
.dyn i small{display:block;font-size:.72em;font-weight:400;opacity:.8}

.map{display:flex;flex-direction:column;gap:.35rem;align-items:center}
.map .row{display:flex;gap:.35rem;justify-content:center;flex-wrap:wrap}
.map span{font-family:var(--serif);font-weight:700;padding:.3em .62em;border:1px solid var(--line);border-radius:3px;font-size:clamp(.9rem,1.55vw,1.35rem);background:var(--panel)}
.map span.hi{background:var(--vermilion);color:#fff;border-color:var(--vermilion);font-weight:900}
.map span.cap{background:var(--gold);color:#171008;border-color:var(--gold);font-weight:900}

.tier{display:flex;flex-direction:column;gap:.45rem;max-width:32em}
.tier div{display:flex;align-items:center;gap:1rem;font-size:clamp(1.05rem,1.8vw,1.55rem)}
.tier .lbl{font-family:var(--serif);font-weight:900;color:var(--vermilion);width:3.6em;white-space:nowrap;flex:0 0 auto}
.tier .bar{height:clamp(1.4rem,3.2vh,2.2rem);background:var(--bronze);border-radius:3px}
.tier .n{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:.8em;white-space:nowrap}

.three{display:flex;flex-direction:column;gap:clamp(.45rem,1.2vh,.9rem);min-width:0}
.three>div{padding:clamp(.5rem,1.4vh,1rem) clamp(.7rem,1.3vw,1.1rem);border-radius:4px;color:#fff;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .9rem;align-items:center;overflow:hidden;min-width:0;min-height:clamp(84px,18vh,180px)}
.three svg{height:clamp(64px,15vh,150px);width:auto;color:#fff;overflow:hidden;grid-row:span 3;align-self:center}
.three .n{font-family:var(--serif);font-size:clamp(1.5rem,3.2vw,2.6rem);font-weight:900;line-height:1.05;min-width:0}
.three .who{font-size:clamp(.95rem,1.45vw,1.25rem);font-weight:900;min-width:0;overflow-wrap:break-word}
.three .where{font-size:clamp(.85rem,1.3vw,1.05rem);opacity:.9;line-height:1.4;min-width:0;overflow-wrap:break-word}
.three .wei{background:#2E4A63}
.three .shu{background:#8C2F1E}
.three .wu{background:#2F5C4A}

.foot{font-size:clamp(.9rem,1.4vw,1.2rem);color:var(--ink-3);line-height:1.5;max-width:40em;margin:0}
.foot b{color:var(--vermilion)}
.credit{font-size:.72rem;color:var(--ink-3);margin:0}

.cover{justify-content:center}
.cover h1{font-family:var(--serif);font-weight:900;margin:0;line-height:1.04;font-size:clamp(2.6rem,8.5vw,7rem)}
.cover h1 em{font-style:normal;color:var(--vermilion)}
.cover .sub{font-size:clamp(1.1rem,2.1vw,1.8rem);color:var(--ink-2);line-height:1.45;max-width:22em;margin:0}
.cover .meta{display:flex;gap:clamp(1.2rem,3.5vw,3rem);flex-wrap:wrap;padding-top:.9rem;border-top:1px solid var(--line-2)}
.cover .meta div{display:flex;flex-direction:column;gap:.15rem}
.cover .meta dt{font-size:.72rem;letter-spacing:.22em;color:var(--ink-3)}
.cover .meta dd{margin:0;font-size:clamp(.95rem,1.5vw,1.25rem);font-weight:900;font-family:var(--serif)}

.notes{flex:0 0 auto;border-top:3px solid var(--vermilion);background:var(--panel);padding:.7rem clamp(1rem,3vw,2.2rem) .85rem;font-size:clamp(.86rem,1.1vw,1rem);line-height:1.6;color:var(--ink-2);max-height:30vh;overflow-y:auto}
.notes .h{font-size:.7rem;letter-spacing:.22em;color:var(--vermilion);font-weight:700;margin-bottom:.35rem}
.notes p{margin:0 0 .4rem}
.notes p:last-child{margin-bottom:0}
.notes b{color:var(--ink);font-weight:700}
.notes .ask{color:var(--bronze);font-weight:700}

.nav{flex:0 0 auto;display:flex;align-items:center;gap:.8rem;padding:.4rem clamp(1rem,3vw,2.2rem) .55rem;border-top:1px solid var(--line-2)}
.dots{display:flex;gap:3px;flex:1 1 auto}
.dots button{flex:1 1 0;min-width:5px;height:6px;padding:0;border:0;border-radius:1px;background:var(--line);cursor:pointer;transition:background .15s}
.dots button:hover{background:var(--ink-3)}
.dots button[aria-current="true"]{background:var(--vermilion)}
.dots button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.arrow{font:inherit;font-size:1.15rem;line-height:1;color:var(--ink-2);background:transparent;border:1px solid var(--line);border-radius:2px;padding:.3rem .8rem;cursor:pointer}
.arrow:hover{color:var(--ink);border-color:var(--ink-3)}
.arrow:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{font-size:.72rem;color:var(--ink-3);white-space:nowrap}
@media (max-width:820px){.hint{display:none}}

/* 放大檢視 */
.lb{position:fixed;inset:0;z-index:50;background:rgba(12,9,8,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;cursor:zoom-out}
.lb img{max-width:96vw;max-height:82vh;object-fit:contain;border-radius:4px}
.lb p{margin:0;color:#EFE6D4;font-family:var(--serif);font-weight:900;font-size:clamp(1rem,1.6vw,1.4rem);text-align:center}
.lb p small{display:block;font-family:var(--sans);font-weight:400;font-size:.72em;opacity:.7;margin-top:.25rem}

/* 圖片來源 */
.src{position:fixed;inset:0;z-index:60;background:rgba(12,9,8,.96);overflow-y:auto;padding:clamp(1.5rem,5vw,3rem)}
.src h3{font-family:var(--serif);color:#EFE6D4;font-size:1.6rem;margin:0 0 1rem}
.src ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem;max-width:60em}
.src li{color:#B9AC8C;font-size:.92rem;line-height:1.55;border-bottom:1px solid rgba(239,230,212,.1);padding-bottom:.6rem}
.src li b{color:#EFE6D4;font-weight:700}
.src li i{font-style:normal;color:#DCB44C}
.src .close{margin-top:1.5rem}
</style>

<div class="bar">
  <div class="mark"><b>{{MARK}}</b><span>{{SUB}}</span></div>
  <div class="tools">
    <button class="btn" id="noteBtn" aria-pressed="false" title="切換講稿提示（N）">講稿提示</button>
    <button class="btn" id="srcBtn" title="圖片來源與授權">圖片來源</button>
    <button class="btn" id="themeBtn" title="切換深淺（T）">深／淺</button>
    <span class="count" id="count">1 / 20</span>
  </div>
</div>

<div class="stage" id="stage"></div>
<div class="notes" id="notes" hidden></div>

<div class="nav">
  <button class="arrow" id="prev" aria-label="上一頁">←</button>
  <div class="dots" id="dots"></div>
  <button class="arrow" id="next" aria-label="下一頁">→</button>
  <span class="hint">← → 翻頁　N 講稿　T 深淺　F 全螢幕　點圖放大</span>
</div>

<div class="lb" id="lb" hidden><img id="lbImg" alt=""><p id="lbCap"></p></div>
<div class="src" id="srcPanel" hidden>
  <h3>圖片來源與授權</h3>
  <ul id="srcList"></ul>
  <button class="btn close" id="srcClose">關閉</button>
</div>

<script>
const EMO={{EMO}};
const IMG={{IMG}};
const CREDIT={{CREDIT}};


const im=(k,name,sub,off)=>`<figure class="${off?'no':''}"><span class="pic"><img class="emo" src="${EMO[k]}" alt="${name||''}"></span>${name?`<figcaption>${name}${sub?`<small>${sub}</small>`:''}</figcaption>`:''}</figure>`;
const ic=k=>`<img class="emo" src="${EMO[k]}" alt="">`;
/* 照片：小圖 */
const ph=(k,name,sub)=>`<figure class="ph"><img class="photo" data-k="${k}" src="${IMG[k]}" alt="${CREDIT[k][0]}">${name?`<figcaption>${name}${sub?`<small>${sub}</small>`:''}</figcaption>`:''}</figure>`;
/* 照片：卡片內 */
const pc=k=>`<img class="photo" data-k="${k}" src="${IMG[k]}" alt="${CREDIT[k][0]}">`;
/* 地圖：大圖 */
const mp=(k,name,sub)=>`<figure class="mapbox"><img class="photo" data-k="${k}" src="${IMG[k]}" alt="${CREDIT[k][0]}"><figcaption>${name}<small>${sub||''}</small></figcaption><span class="zoomhint">點一下放大</span></figure>`;

/* ═══ Q 版漢代人物（OpenMoji 沒有的衣冠，用基本形狀組出來） ═══ */
const SKIN="#F5C9A0", HAIR="#2B221C";
function hat(kind,c){
  switch(kind){
    case "mian":
      return `<rect x="22" y="4" width="56" height="7" rx="2" fill="#1F1A15"/>
        <path d="M33 11 h34 v10 a17 10 0 0 1-34 0 Z" fill="${c||'#C9A227'}"/>
        <g stroke="#C9A227" stroke-width="1.6"><path d="M32 8 v13"/><path d="M50 8 v15"/><path d="M68 8 v13"/></g>
        <g fill="#E8D48A"><circle cx="32" cy="14" r="2.4"/><circle cx="32" cy="20" r="2.4"/>
        <circle cx="50" cy="15" r="2.4"/><circle cx="50" cy="22" r="2.4"/>
        <circle cx="68" cy="14" r="2.4"/><circle cx="68" cy="20" r="2.4"/></g>`;
    case "jin":
      return `<path d="M34 26 L36 6 h28 l2 20 Z" fill="${c||'#2B2620'}"/>
        <path d="M36 6 q14-5 28 0" fill="none" stroke="#EFE6D4" stroke-width="1.6"/>
        <path d="M30 26 q20-6 40 0" fill="${c||'#2B2620'}"/>`;
    case "wu":
      return `<path d="M25 32 a25 25 0 0 1 50 0 Z" fill="#6E655A"/>
        <path d="M25 30 h50 v5 h-50 Z" fill="#4A423A"/>
        <path d="M50 8 l-5 -9 h10 Z" fill="#C4331C"/>`;
    case "douli":
      return `<path d="M14 30 q36-30 72 0 Z" fill="#C9A227"/>
        <path d="M14 30 q36-8 72 0" fill="none" stroke="#8A6E18" stroke-width="1.6"/>`;
    case "jinhuang":
      return `<path d="M26 30 q24-24 48 0 l0-6 q-24-16-48 0 Z" fill="#DCB44C"/>
        <path d="M72 22 l12-5 -3 8 9 1 -14 6 Z" fill="#DCB44C"/>`;
    case "ze":
      return `<path d="M30 27 q20-19 40 0 Z" fill="${c||'#3C4E63'}"/>
        <path d="M30 27 h40 v3 h-40 Z" fill="#2A3646"/>`;
    case "ru":
      return `<path d="M28 28 q22-22 44 0 l0-7 q-22-13-44 0 Z" fill="#EFE6D4"/>
        <path d="M72 26 l7 16 -6 -2 -3 5 Z" fill="#EFE6D4"/>`;
    default:
      return `<circle cx="50" cy="10" r="7" fill="${HAIR}"/>`;
  }
}
function prop(kind){
  switch(kind){
    case "spear": return `<rect x="90" y="10" width="4" height="112" rx="2" fill="#7A5C36"/><path d="M92 10 l-6 -14 12 0 Z" fill="#9AA3A8"/>`;
    case "dao": return `<path d="M88 44 q16-22 12 -40 q-3 26 -6 40 Z" fill="#B8BEC2"/><rect x="86" y="42" width="8" height="26" rx="3" fill="#4A423A"/><circle cx="90" cy="72" r="6" fill="none" stroke="#C9A227" stroke-width="3"/>`;
    case "hoe": return `<rect x="90" y="24" width="4" height="96" rx="2" fill="#7A5C36" transform="rotate(8 92 72)"/><path d="M78 26 h20 v9 h-20 Z" fill="#6E7276"/>`;
    case "jian": return `<g fill="#D8C79A" stroke="#8A7B52" stroke-width="1"><rect x="80" y="52" width="5" height="46" rx="2"/><rect x="87" y="50" width="5" height="48" rx="2"/><rect x="94" y="52" width="5" height="46" rx="2"/></g>`;
    case "fu": return `<path d="M84 46 q14 8 14 30 q-14 6 -14 -30 Z" fill="#EFE6D4" stroke="#B9AC8C" stroke-width="1.2"/>`;
    case "bag": return `<path d="M82 62 q10-8 18 0 l3 26 q-12 6 -24 0 Z" fill="#8C6B3F"/><path d="M82 68 q12 5 21 0" fill="none" stroke="#5E4626" stroke-width="2"/>`;
    default: return "";
  }
}
function chr(o){
  o=o||{};
  const robe=o.robe||"#4F7460", cuff=o.cuff||"rgba(0,0,0,.22)", w=o.fat?1.16:1;
  const beard = o.beard==="long"
      ? `<path d="M42 52 q8 22 16 0" fill="${HAIR}" opacity=".9"/><path d="M40 48 q10 4 20 0" fill="none" stroke="${HAIR}" stroke-width="2.6" stroke-linecap="round"/>`
    : o.beard==="mo"
      ? `<path d="M40 48 q10 5 20 0" fill="none" stroke="${HAIR}" stroke-width="2.8" stroke-linecap="round"/>` : "";
  const mouth = o.sad
      ? `<path d="M44 54 q6-5 12 0" fill="none" stroke="#7A4A38" stroke-width="2.4" stroke-linecap="round"/>`
      : `<path d="M44 52 q6 7 12 0" fill="none" stroke="#7A4A38" stroke-width="2.4" stroke-linecap="round"/>`;
  return `<svg viewBox="-6 -10 112 144" role="img">
    <g stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M50 62 c-15 0 -21 7 -23 22 l-5 ${o.small?70:80} q28 8 56 0 l-5 ${o.small?-70:-80} c-2 -15 -8 -22 -23 -22 Z"
            fill="${robe}" transform="scale(${w},1) translate(${(1-w)*50/w},0)"/>
      <path d="M27 70 c-10 6 -14 24 -12 38 l13 -5 Z" fill="${robe}"/>
      <path d="M73 70 c10 6 14 24 12 38 l-13 -5 Z" fill="${robe}"/>
      <path d="M40 62 L50 82 L60 62" fill="none" stroke-width="3"/>
      <path d="M28 ${o.small?96:106} q22 7 44 0" fill="none" stroke="${cuff}" stroke-width="5"/>
      <circle cx="50" cy="40" r="22" fill="${SKIN}"/>
      <path d="M28 38 q22-26 44 0 q-10-12 -22 -11 q-12 -1 -22 11 Z" fill="${o.hair||HAIR}"/>
    </g>
    ${hat(o.hat,o.hatColor)}
    <g>
      <ellipse cx="33" cy="46" rx="4.5" ry="2.8" fill="#E08A7A" opacity=".45"/>
      <ellipse cx="67" cy="46" rx="4.5" ry="2.8" fill="#E08A7A" opacity=".45"/>
      <circle cx="42" cy="40" r="3.4" fill="#241C16"/><circle cx="58" cy="40" r="3.4" fill="#241C16"/>
      <circle cx="43.2" cy="38.8" r="1.2" fill="#fff"/><circle cx="59.2" cy="38.8" r="1.2" fill="#fff"/>
      ${mouth}${beard}
    </g>
    ${prop(o.prop)}
  </svg>`;
}
const cf=(svg,name,sub)=>`<figure>${svg}<figcaption>${name}${sub?`<small>${sub}</small>`:''}</figcaption></figure>`;

  <g stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">

    <path d="M62 114 v-40 q22-16 44 0 v40 Z" fill="#5E4A34"/>
    <path d="M84 74 v40" fill="none" stroke-width="2"/>
    <path d="M50 40 h68 l-6 -14 h-56 Z" fill="#8C2F1E"/>
    <path d="M56 26 h56 l-8 -12 h-40 Z" fill="#8C2F1E"/>

/* ═══ 投影片 ═══ */
const S={{SLIDES}};


const stage=document.getElementById('stage'),notes=document.getElementById('notes'),
      dots=document.getElementById('dots'),count=document.getElementById('count'),
      noteBtn=document.getElementById('noteBtn'),themeBtn=document.getElementById('themeBtn'),
      lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbCap=document.getElementById('lbCap'),
      srcBtn=document.getElementById('srcBtn'),srcPanel=document.getElementById('srcPanel');
let i=0, showNotes=false;

document.getElementById('srcList').innerHTML=Object.entries(CREDIT)
  .map(([k,v])=>`<li><b>${v[0]}</b><br><i>${v[1]}</i></li>`).join('');

S.forEach((_,n)=>{
  const b=document.createElement('button');
  b.type='button'; b.setAttribute('aria-label','第 '+(n+1)+' 頁');
  b.onclick=()=>go(n); dots.appendChild(b);
});
function render(){
  const s=S[i];
  stage.innerHTML='<div class="slide'+(s.cover?' cover':'')+'">'+s.html+'</div>';
  notes.innerHTML='<div class="h">講稿提示 · 第 '+(i+1)+' 頁</div>'+s.note;
  notes.hidden=!showNotes;
  count.textContent=(i+1)+' / '+S.length;
  [...dots.children].forEach((b,n)=>b.setAttribute('aria-current',n===i));
}
function go(n){ i=Math.max(0,Math.min(S.length-1,n)); render(); }
document.getElementById('prev').onclick=()=>go(i-1);
document.getElementById('next').onclick=()=>go(i+1);
noteBtn.onclick=()=>{ showNotes=!showNotes; noteBtn.setAttribute('aria-pressed',showNotes); render(); };
themeBtn.onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
};
srcBtn.onclick=()=>{srcPanel.hidden=false};
document.getElementById('srcClose').onclick=()=>{srcPanel.hidden=true};

function openLb(k){
  lbImg.src=IMG[k];
  lbCap.innerHTML=CREDIT[k][0]+'<small>'+CREDIT[k][1]+'</small>';
  lb.hidden=false;
}
lb.onclick=()=>{lb.hidden=true};
stage.addEventListener('click',e=>{
  const p=e.target.closest('.photo');
  if(p){ e.stopPropagation(); openLb(p.dataset.k); return; }
  if(e.target.closest('a,button'))return;
  go(i+(e.clientX<innerWidth/2?-1:1));
});
addEventListener('keydown',e=>{
  if(!lb.hidden||!srcPanel.hidden){ if(e.key==='Escape'){lb.hidden=true;srcPanel.hidden=true} return; }
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
  else if(e.key==='Home'){go(0)} else if(e.key==='End'){go(S.length-1)}
  else if(e.key==='n'||e.key==='N'){noteBtn.click()}
  else if(e.key==='t'||e.key==='T'){themeBtn.click()}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
render();
</script>
